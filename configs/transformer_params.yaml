# Modern decoder + parameter enrichment (Wave 5).
# max_len bumped — enriched streams are ~1.5–2× longer than STEP-only routes.
model:
  arch: modern
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.15
  max_len: 256
  dim_feedforward: 1024
training:
  epochs: 100
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  num_workers: 0
  label_smoothing: 0.1
  scheduler: cosine
  warmup_steps: 500
  amp: true
  param_enrichment: after_step
