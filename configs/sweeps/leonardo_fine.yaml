# Leonardo Wave 2 — fine grid around Wave 1 winners.
#
# Wave 1 signal (from artifacts/sweeps/LEADERBOARD_FINAL.csv):
#   Task 1 leader: f_drop15_100_mrr   (MRR 0.8731, top1 0.7483, best_epoch 84)
# Wave 2 result (2026-05-31):
#   Task 1 leader: f_drop15_100_mrr      (MRR 0.8731 — unchanged from Wave 1)
#   Task 2 leader: g_drop15_nosched_t2   (dev_token_acc 0.4545, best_epoch 80)
#   Negative result: f_extras_500_100_mrr WORSE than 1x — stop chasing extras volume.
#
# This grid: drop15 ± neighbours, drop15 × Task-2 selection, drop15 longer.
# Skip the lr/ls dimensions (Wave 1 + shortlist already covered them).
#
# Submit: python scripts/sweep_transformer.py --sweep configs/sweeps/leonardo_fine.yaml --stage finalists --row N

defaults:
  base_config: configs/transformer_medium.yaml
  extra_data_dir: data/generated/infineon
  epochs: 120
  save_best_by: dev_mrr
  eval_task1_every: 1
  eval_task2_every: 5
  amp: true
  scheduler: cosine
  warmup_steps: 500
  label_smoothing: 0.1

finalists:
  # ---- Track A: tighten around the Task-1 winner (drop15) ----
  - run_name: g_drop12_mrr
    dropout: 0.12
    note: lower neighbour of winning dropout
  - run_name: g_drop17_mrr
    dropout: 0.17
    note: upper neighbour of winning dropout
  - run_name: g_drop15_150_mrr
    dropout: 0.15
    epochs: 150
    note: winner + 50 more epochs (it peaked at 84/100)

  # ---- Track B: produce a Task-2 specialist using the winning dropout ----
  - run_name: g_drop15_t2
    dropout: 0.15
    save_best_by: dev_token_acc
    note: marry Task-1 winning dropout with Task-2 selection criterion

  # ---- Track C: combine winning dropout with no-scheduler (Task-2 leader recipe) ----
  - run_name: g_drop15_nosched_t2
    dropout: 0.15
    scheduler: none
    warmup_steps: 0
    save_best_by: dev_token_acc
    note: drop15 × no-scheduler × t2-selection

  # ---- Track D (single shot): larger model. Skip if Track A-C already win. ----
  # Uncomment only if Wave 2 trackA shows the medium model is saturated.
  # - run_name: g_large_drop15
  #   d_model: 384
  #   n_layers: 8
  #   n_heads: 8
  #   dim_feedforward: 1536
  #   batch_size: 128
  #   dropout: 0.15
  #   epochs: 80
